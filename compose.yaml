x-api-build: &api-build
  context: .
  dockerfile: backend/Dockerfile
  target: api
x-db-env: &db-env
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${TEAM_DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: *api-build
    environment: *db-env
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}

  api:
    build: *api-build
    restart: unless-stopped
    environment:
      <<: *db-env
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
    volumes:
      - type: bind
        source: ${GAIT_MODEL_DIR:-./local_data/models}
        target: /models
        read_only: true
    ports:
      - "127.0.0.1:${TEAM_API_PORT:-8000}:8000"
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    build:
      <<: *api-build
      target: analysis
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GAIT_MODEL_ASSETS: /models
      GAIT_STT_SOURCE: /models/transformer-gait-analysis
    volumes:
      - type: bind
        source: ${GAIT_MODEL_DIR:-./local_data/models}
        target: /models
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      migrate: {condition: service_completed_successfully}

  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TEAM_WEB_PORT:-5176}:80"
    volumes:
      - ./mobile/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]

volumes:
  postgres_data:
