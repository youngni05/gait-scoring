name: Browser Integration CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+psycopg://ci_user:ci_password@127.0.0.1:5432/gait_e2e_ci
      GAIT_E2E_DB_WRITES: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: gait_e2e_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d gait_e2e_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-e2e.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - name: Install API and browser test dependencies
        run: |
          python -m pip install -r backend/requirements.txt -r backend/requirements-e2e.txt
          python -m pip check
          python -m playwright install --with-deps chromium
          npm ci
      - name: Verify test syntax
        run: python -m compileall -q backend/tests/e2e
      - name: Ensure synthetic controls cannot ship even with E2E flag
        env:
          VITE_E2E_MODE: 'true'
        run: |
          npm run build:mobile
          npx --no-install tsc -p legacy-ui/tsconfig.json
          npx --no-install vite build legacy-ui
          node scripts/check-production-e2e.mjs --include-legacy
      - name: Run Chromium UI against real API and PostgreSQL
        working-directory: backend
        run: python -m unittest discover -s tests/e2e -v
