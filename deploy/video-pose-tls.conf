# Include only inside the public HTTPS server. The API port is loopback-only.
location = /api/team/video-pose {
    client_max_body_size 64m;
    client_body_timeout 30s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_ignore_client_abort off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-HappyWalk-Video-Transport tls-stream-v1;
    proxy_pass http://127.0.0.1:8000/team/video-pose;
    proxy_read_timeout 180s;
    access_log off;
    add_header Cache-Control "no-store" always;
}
